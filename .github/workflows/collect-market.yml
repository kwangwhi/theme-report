name: 장마감 데이터 수집

on:
  schedule:
    # 평일 15:45 (한국시간) = 06:45 (UTC)
    # GitHub 예약 실행은 1~3시간씩 늦게 시작되는 일이 잦아(11/13 16:54, 11/16 18:23 실행)
    # 같은 작업을 여러 번 걸어 둔다. 바뀐 내용이 없으면 커밋하지 않으므로 중복 실행해도 안전.
    # 장마감 리포트 예약 작업(16:21)도 시작할 때 이 작업을 직접 실행(Run workflow)한다.
    - cron: "45 6 * * 1-5"
    - cron: "55 6 * * 1-5"
    - cron: "5 7 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: write

concurrency:
  group: collect-market
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: pip install finance-datareader

      - name: 데이터 수집
        run: python scripts/collect_market.py

      - name: 결과 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git commit -m "장마감 데이터 수집 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
