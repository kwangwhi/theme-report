name: 아침 준비 리포트

on:
  schedule:
    # 평일 08:30 (한국시간) = 전날 23:30 (UTC), 일~목
    - cron: "30 23 * * 0-4"
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 리포트 만들기
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python scripts/morning_report.py

      - name: 결과 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morning.html data/krx/
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git commit -m "아침 준비 리포트 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
