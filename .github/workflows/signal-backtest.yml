name: 신호 성적표

on:
  schedule:
    # 매주 토요일 09:17 (한국시간) = 토요일 00:17 (UTC)
    - cron: "17 0 * * 6"
  workflow_dispatch:
    inputs:
      days:
        description: "검증 영업일 수 (기본 60)"
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 도구 설치
        run: pip install pykrx finance-datareader

      - name: 성적표 계산
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          BACKTEST_DAYS: ${{ github.event.inputs.days }}
        run: python scripts/signal_backtest.py

      - name: 결과 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/ backtest.html
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git commit -m "신호 성적표 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
